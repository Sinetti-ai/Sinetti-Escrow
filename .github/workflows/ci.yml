name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm run check:dependencies
      # The npm audit endpoint returns 503 now and then; retry before failing the job.
      - run: |
          for attempt in 1 2 3; do
            npm run audit:dependencies && exit 0
            echo "audit attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:hardhat

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: npm ci
      - run: npm run test:forge

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run example
      - run: npm run example:dispute
      - run: npm run example:timeout

  types-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run validate:schemas

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.13
          check-latest: false
      - run: npm ci
      - run: python3 -m pip install --disable-pip-version-check slither-analyzer==0.11.6
      - run: python3 -m pip check
      - run: python3 -c 'import importlib.metadata as m; assert m.version("slither-analyzer") == "0.11.6"'
      - name: Run Slither and enforce the reviewed high/medium baseline
        run: |
          slither . --json slither.json || test -s slither.json
          node scripts/check-slither.mjs slither.json

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject unresolved marker literals
        run: |
          if grep -qE '\[YEAR\]|\[LEGAL ENTITY\]|UNRESOLVED' NOTICE SECURITY.md; then
            grep -nE '\[YEAR\]|\[LEGAL ENTITY\]|UNRESOLVED' NOTICE SECURITY.md
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm run check:publication
      - name: Require Solidity SPDX headers
        run: |
          missing=0
          while IFS= read -r file; do
            head -1 "$file" | grep -q 'SPDX-License-Identifier: Apache-2.0' || {
              echo "missing Apache-2.0 SPDX header: $file"
              missing=1
            }
          done < <(find contracts -name '*.sol' -not -path '*/node_modules/*')
          exit "$missing"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --redact --verbose

  # The branch rule on main requires one check named `test`. This job carries
  # that name and fails when any job above failed, was cancelled or was skipped.
  test:
    if: always()
    needs:
      - dependencies
      - hardhat
      - foundry
      - examples
      - types-and-schemas
      - static-analysis
      - source-hygiene
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all CI jobs succeeded"
