name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build the source archive and checksums
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="sinetti-escrow-${tag}/" -o "sinetti-escrow-${tag}.tar.gz" "${tag}"
          sha256sum "sinetti-escrow-${tag}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign the checksums with Sigstore keyless signing
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" --verify-tag --generate-notes --title "Sinetti Escrow ${tag}" \
            "sinetti-escrow-${tag}.tar.gz" SHA256SUMS SHA256SUMS.sigstore.json
