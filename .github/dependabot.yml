# Grouped updates so at most one pull request per ecosystem is open at a time.
# The seven-day cooldown on version updates skips a release for a week after it
# appears, so a yanked or compromised release does not land here first.
# Security updates are not subject to the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-version:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # hardhat 3 and toolbox 7 change the config format and test runner. That
    # migration is a planned change, tracked in SECURITY.md under Dependencies,
    # and does not arrive as a weekly bump.
    ignore:
      - dependency-name: hardhat
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions-version:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
